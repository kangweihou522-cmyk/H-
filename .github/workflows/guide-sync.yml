name: 使用说明与 Word 同步检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guide-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: Check HTML, Word and code fingerprint
        run: python scripts/build_user_guide.py --check
